[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranops"
version = "0.1.0"
description = "Vendor-neutral 4G RAN operations toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "lxml>=5,<6",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<5",
    "pytest>=8,<10",
    "ruff==0.11.13",
    "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ranops.core" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
